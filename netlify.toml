# Netlify Configuration for Sayan Nan Executive Portfolio
[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Direct page refreshes route cleanly to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-performance asset caching for scroll frames sequence
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# High-performance caching for hashed assets (JS/CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure manifest.json is served with fresh headers
[[headers]]
  for = "/frames/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
